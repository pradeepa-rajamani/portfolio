trigger: none

pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
  - repository: devopsTemplates
    type: git
    name: pradeepavenkatproject/devops-platform-repo
    ref: main
  pipelines:
  - pipeline: ciBuild
    source: 'WeatherFunctionApp-CI'
    trigger: none

steps:
- checkout: self

- template: pipelines/templates/deploy/functionapp-deploy.yml@devopsTemplates
  parameters:
    azureSubscription: 'DevOps-Platform-Connection'
    functionAppName: 'WeatherFunctionApp'
    resourceGroupName: 'rg-weather-apps'
    artifactName: 'weather-func'
    packagePath: '$(Pipeline.Workspace)/ciBuild/weather-func/weather-func.zip'
    appType: 'functionAppLinux'
    isFlexConsumption: true
    slotName: ''
